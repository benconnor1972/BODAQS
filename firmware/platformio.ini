[platformio]
default_envs = thingplus_s3_usb_cdcserial

[env]
extra_scripts = pre:tools/configure_bmi270_sensorapi.py

[common]
bmi270_sensorapi =
  https://github.com/boschsensortec/BMI270_SensorAPI.git#41129fcfe39c583ee5462d79195741945d51c1fe

; Versions used by the latest RC3 test image, shared by all beta board builds.
beta_lib_deps =
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit SSD1306@2.5.17
  bblanchon/ArduinoJson@7.4.3
  sparkfun/SparkFun u-blox GNSS v3@3.1.15
  ${common.bmi270_sensorapi}

[env:thingplus_s3_usb_uartserial]
platform = espressif32
board = sparkfun_esp32s3_thing_plus
framework = arduino

; Use your project-local variant/pins
board_build.variants_dir = variants

; Arduino default from boards.txt
board_build.partitions = no_ota.csv

monitor_speed = 115200

; USB settings: upload over USB, but keep Serial on UART (more conservative)
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBODAQS_FW_VERSION=\"0.4.1\"

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  bblanchon/ArduinoJson
  sparkfun/SparkFun u-blox GNSS v3@^3.1.14
  ${common.bmi270_sensorapi}

; --- Optional: if you want Serial over USB CDC instead of UART ---
[env:thingplus_s3_usb_cdcserial]
platform = espressif32
board = sparkfun_esp32s3_thing_plus
framework = arduino
board_build.variants_dir = variants
board_build.partitions = no_ota.csv
monitor_speed = 115200


build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.4.1\"

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  bblanchon/ArduinoJson
  sparkfun/SparkFun u-blox GNSS v3@^3.1.14
  ${common.bmi270_sensorapi}

[env:thingplus_s3_usb_cdcserial_uart_i2c1]
platform = espressif32
board = sparkfun_esp32s3_thing_plus
framework = arduino
board_build.variants_dir = variants
board_build.partitions = no_ota.csv
monitor_speed = 115200

build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_BOARD_PROFILE=ThingPlusS3_BODAQS_4_D_UartI2C1
  -DBODAQS_FW_VERSION=\"0.4.1\"

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  bblanchon/ArduinoJson
  sparkfun/SparkFun u-blox GNSS v3@^3.1.14
  ${common.bmi270_sensorapi}

[env:thingplus_s3_usb_cdcserial_bodaqs_4f]
platform = espressif32
board = sparkfun_esp32s3_thing_plus
framework = arduino
board_build.variants_dir = variants
board_build.partitions = no_ota.csv
monitor_speed = 115200

build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-beta\"
  -DBODAQS_FW_NAME=\"bodaqs_4f\"
  -DBODAQS_BOARD_PROFILE=ThingPlusS3_BODAQS_4_F
  -DBODAQS_I2C_TRANSFER_PRIORITY=2
  -DBODAQS_I2C_STARTUP_DIAGNOSTICS=1

lib_deps = ${common.beta_lib_deps}

[env:bodaqs_s3_mini_n4r2]
platform = espressif32
board = bodaqs_s3_mini_n4r2
framework = arduino
board_build.variants_dir = variants
board_build.partitions = no_ota.csv
monitor_speed = 115200

build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-beta\"
  -DBODAQS_FW_NAME=\"bodaqs_a8\"
  -DBODAQS_BOARD_PROFILE=BODAQS_A8
  -DBODAQS_I2C_TRANSFER_PRIORITY=2
  -DBODAQS_I2C_STARTUP_DIAGNOSTICS=1

lib_deps = ${common.beta_lib_deps}

; RC3 shares the A8 pin mapping but retains sleep as user power-off.
[env:bodaqs_s3_mini_n4r2_rc3]
extends = env:bodaqs_s3_mini_n4r2
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-beta\"
  -DBODAQS_FW_NAME=\"bodaqs_v1RC3\"
  -DBODAQS_BOARD_PROFILE=BODAQS_V1RC3
  -DBODAQS_I2C_TRANSFER_PRIORITY=2
  -DBODAQS_I2C_STARTUP_DIAGNOSTICS=1

; Startup-only CHIP_ID speed comparison; production environments omit it.
[env:bodaqs_s3_mini_n4r2_rc3_i2c_probe]
extends = env:bodaqs_s3_mini_n4r2_rc3
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-alpha-i2c-probe\"
  -DBODAQS_FW_NAME=\"bodaqs_v1RC3_i2c_probe\"
  -DBODAQS_BOARD_PROFILE=BODAQS_V1RC3
  -DBODAQS_BMI270_I2C_PROBE=1

; Increased BDQ v2 producer queues, retaining the startup probe for comparison.
[env:bodaqs_s3_mini_n4r2_rc3_i2c_probe_q2]
extends = env:bodaqs_s3_mini_n4r2_rc3_i2c_probe
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-alpha-i2c-probe-q2\"
  -DBODAQS_FW_NAME=\"bodaqs_v1RC3_i2c_probe_q2\"
  -DBODAQS_BOARD_PROFILE=BODAQS_V1RC3
  -DBODAQS_BMI270_I2C_PROBE=1

; Transfer-completion priority experiment with the enlarged queues, no boot probe.
[env:bodaqs_s3_mini_n4r2_rc3_i2c_priority]
extends = env:bodaqs_s3_mini_n4r2_rc3
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-alpha-i2c-priority-q2\"
  -DBODAQS_FW_NAME=\"bodaqs_v1RC3_i2c_priority_q2\"
  -DBODAQS_BOARD_PROFILE=BODAQS_V1RC3
  -DBODAQS_I2C_TRANSFER_PRIORITY=2

[env:bodaqs_s3_mini_n4r2_bringup]
platform = espressif32
board = bodaqs_s3_mini_n4r2
framework = arduino
board_build.variants_dir = variants
board_build.partitions = no_ota.csv
monitor_speed = 115200

build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.4.1\"
  -DBODAQS_BOARD_PROFILE=BODAQS_A8
  -DBODAQS_BRINGUP_DIAGNOSTICS=1

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  bblanchon/ArduinoJson
  sparkfun/SparkFun u-blox GNSS v3@^3.1.14
  ${common.bmi270_sensorapi}

; Restored whole-FIFO two-deferral scheduler with startup recovery diagnostics.
[env:bodaqs_s3_mini_n4r2_rc3_i2c_startup]
extends = env:bodaqs_s3_mini_n4r2_rc3_i2c_priority
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-alpha-i2c-simple2-q2\"
  -DBODAQS_FW_NAME=\"bodaqs_v1RC3_i2c_simple2_q2\"
  -DBODAQS_BOARD_PROFILE=BODAQS_V1RC3
  -DBODAQS_I2C_TRANSFER_PRIORITY=2
  -DBODAQS_I2C_STARTUP_DIAGNOSTICS=1

lib_deps =
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit SSD1306@2.5.17
  bblanchon/ArduinoJson@7.4.3
  sparkfun/SparkFun u-blox GNSS v3@3.1.15
  ${common.bmi270_sensorapi}

; Two-deferral RC3 image with optional SD startup reports (off by default).
[env:bodaqs_s3_mini_n4r2_rc3_startup_log]
extends = env:bodaqs_s3_mini_n4r2_rc3_i2c_startup
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-alpha-i2c-bootlog-q2\"
  -DBODAQS_FW_NAME=\"bodaqs_v1RC3_i2c_bootlog_q2\"
  -DBODAQS_BOARD_PROFILE=BODAQS_V1RC3
  -DBODAQS_I2C_TRANSFER_PRIORITY=2
  -DBODAQS_I2C_STARTUP_DIAGNOSTICS=1

; Log-start UX, automatic BDQ v2 selection, retained two-deferral scheduler.
[env:bodaqs_s3_mini_n4r2_rc3_log_start]
extends = env:bodaqs_s3_mini_n4r2_rc3_startup_log
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-alpha-log-start-q2\"
  -DBODAQS_FW_NAME=\"bodaqs_v1RC3_log_start_q2\"
  -DBODAQS_BOARD_PROFILE=BODAQS_V1RC3
  -DBODAQS_I2C_TRANSFER_PRIORITY=2
  -DBODAQS_I2C_STARTUP_DIAGNOSTICS=1

; Sensor-list Input column, with the previous log-start behavior retained.
[env:bodaqs_s3_mini_n4r2_rc3_sensor_inputs]
extends = env:bodaqs_s3_mini_n4r2_rc3_log_start
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBODAQS_FW_VERSION=\"0.6.1-alpha-sensor-inputs-q2\"
  -DBODAQS_FW_NAME=\"bodaqs_v1RC3_sensor_inputs_q2\"
  -DBODAQS_BOARD_PROFILE=BODAQS_V1RC3
  -DBODAQS_I2C_TRANSFER_PRIORITY=2
  -DBODAQS_I2C_STARTUP_DIAGNOSTICS=1
