name: Desktop CI

on:
  pull_request:
    paths:
      - analysis/**
      - application/cohort-workbench-prototype/**
      - import-manager/**
      - requirements.txt
      - .github/workflows/desktop-ci.yml
  push:
    branches: [main]
    paths:
      - analysis/**
      - application/cohort-workbench-prototype/**
      - import-manager/**
      - requirements.txt
      - .github/workflows/desktop-ci.yml
    tags: [Desktop-v*]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version string for artifact filenames.
        required: false
        type: string
      import_manager_version:
        description: Import Manager component version.
        default: "0.1.9-beta"
        required: false
        type: string
      library_service_version:
        description: Library Service component version.
        default: "0.2.0-beta"
        required: false
        type: string
      workbench_version:
        description: Workbench component version.
        default: "0.2.0-beta"
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  BUILD_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
  IMPORT_MANAGER_VERSION: ${{ inputs.import_manager_version || '0.1.9-beta' }}
  LIBRARY_SERVICE_VERSION: ${{ inputs.library_service_version || '0.2.0-beta' }}
  WORKBENCH_VERSION: ${{ inputs.workbench_version || '0.2.0-beta' }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Windows release-signing script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'import-manager/sign_windows_release.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if (@($parseErrors).Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            throw 'Windows release-signing script contains PowerShell parse errors.'
          }
      - name: Derive build version from release-candidate tag
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        shell: pwsh
        run: '"BUILD_VERSION=$($env:GITHUB_REF_NAME.Substring(9))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/cohort-workbench-prototype/package-lock.json
      - name: Install Workbench dependencies
        working-directory: application/cohort-workbench-prototype
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller pillow
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Test Python packages
        env:
          MPLBACKEND: Agg
        run: python -m pytest analysis/tests -q
      - name: Build and smoke-test Windows installer
        run: >-
          .\import-manager\build_import_manager.ps1 -Target installer
          -BundleVersion $env:BUILD_VERSION -ImportManagerVersion $env:IMPORT_MANAGER_VERSION
          -LibraryServiceVersion $env:LIBRARY_SERVICE_VERSION -WorkbenchVersion $env:WORKBENCH_VERSION
      - name: Create Certum signing-candidate checksum
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'import-manager/dist/installer/windows/*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows installer was not found.'
          }
          Get-FileHash -Algorithm SHA256 $installer.FullName |
            ForEach-Object { "{0} *{1}" -f $_.Hash, $installer.Name } |
            Set-Content -NoNewline -Encoding ascii "$($installer.FullName).sha256"
      - name: Upload unsigned Windows CI installer
        if: ${{ !startsWith(github.ref, 'refs/tags/Desktop-v') }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-x64-${{ env.BUILD_VERSION }}
          path: import-manager/dist/installer/windows/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Certum signing candidate
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-${{ env.BUILD_VERSION }}-certum-signing-candidate
          path: |
            import-manager/dist/installer/windows/*.exe
            import-manager/dist/installer/windows/*.exe.sha256
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Derive build version from release-candidate tag
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        run: echo "BUILD_VERSION=${GITHUB_REF_NAME#Desktop-v}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/cohort-workbench-prototype/package-lock.json
      - name: Install Workbench dependencies
        working-directory: application/cohort-workbench-prototype
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller pillow
      - name: Test Python packages
        env:
          MPLBACKEND: Agg
        run: python -m pytest analysis/tests -q
      - name: Build unsigned macOS app
        run: >-
          ./import-manager/build_import_manager_macos.sh --skip-dmg --skip-icns
          --version "$BUILD_VERSION" --manager-version "$IMPORT_MANAGER_VERSION"
          --service-version "$LIBRARY_SERVICE_VERSION" --workbench-version "$WORKBENCH_VERSION"
      - name: Smoke-test packaged macOS app
        run: |
          app="import-manager/dist/pyinstaller/BODAQS Import Manager.app/Contents/MacOS/BODAQS Import Manager"
          python import-manager/tools/smoke_test_packaged_imu_bdq.py "$app"
          python import-manager/tools/smoke_test_packaged_imu_bdq.py "$app" --check-workbench-layout
      - name: Check macOS release-signing secrets
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          for secret_name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_API_KEY_BASE64 \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_KEY_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "error: required GitHub Actions secret ${secret_name} is not set" >&2
              exit 1
            fi
          done
      - name: Import Developer ID signing certificate
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/bodaqs-developer-id.p12"
          keychain_path="$RUNNER_TEMP/bodaqs-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$signing_identity" ]]; then
            echo "error: the certificate bundle does not contain a Developer ID Application signing identity" >&2
            exit 1
          fi

          echo "MACOS_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
      - name: Sign, notarize, and staple macOS DMG
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        env:
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          app="import-manager/dist/pyinstaller/BODAQS Import Manager.app"
          dmg="import-manager/dist/BODAQS-Import-Manager-${BUILD_VERSION}-macos-${{ matrix.arch }}.dmg"
          dmg_root="$RUNNER_TEMP/bodaqs-dmg-root"
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          notary_result="$RUNNER_TEMP/bodaqs-notary-result.json"

          # The bundled Library Service is a PyInstaller application under
          # Contents/Resources.  codesign --deep does not reliably discover
          # executable code in arbitrary resource directories, so sign every
          # Mach-O payload first, then seal the outer app bundle last.
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              echo "Signing nested Mach-O: $binary"
              codesign --force --options runtime --timestamp \
                --sign "$MACOS_SIGNING_IDENTITY" "$binary"
            fi
          done < <(find "$app" -type f -print0)
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          cp -R "$app" "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"
          cat > "$dmg_root/README.txt" <<'EOF'
          BODAQS Import Manager
          =====================

          Drag BODAQS Import Manager to the Applications folder to install.
          EOF
          rm -f "$dmg"
          hdiutil create -volname "BODAQS Import Manager" -srcfolder "$dmg_root" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"

          printf '%s' "$APPLE_NOTARY_API_KEY_BASE64" | base64 --decode > "$notary_key"
          set +e
          xcrun notarytool submit "$dmg" --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --output-format json > "$notary_result"
          notary_exit_code=$?
          set -e
          cat "$notary_result"

          submission_id="$(plutil -extract id raw "$notary_result")"
          submission_status="$(plutil -extract status raw "$notary_result")"
          if [[ "$notary_exit_code" -ne 0 || "$submission_status" != "Accepted" ]]; then
            echo "error: Apple notarization status: ${submission_status:-unknown}" >&2
            if [[ -n "$submission_id" ]]; then
              echo "Apple notarization log for submission $submission_id:" >&2
              xcrun notarytool log "$submission_id" --key "$notary_key" \
                --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
            fi
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
      - name: Package unsigned macOS DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/Desktop-v') }}
        run: |
          app="import-manager/dist/pyinstaller/BODAQS Import Manager.app"
          dmg="import-manager/dist/BODAQS-Import-Manager-${BUILD_VERSION}-macos-${{ matrix.arch }}.dmg"
          dmg_root="$RUNNER_TEMP/bodaqs-dmg-root"

          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          cp -R "$app" "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"
          cat > "$dmg_root/README.txt" <<'EOF'
          BODAQS Import Manager
          =====================

          This is an unsigned CI build, not an official macOS release.
          EOF
          hdiutil create -volname "BODAQS Import Manager" -srcfolder "$dmg_root" -ov -format UDZO "$dmg"
      - name: Upload unsigned macOS DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/Desktop-v') }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-macos-${{ matrix.arch }}-${{ env.BUILD_VERSION }}
          path: import-manager/dist/BODAQS-Import-Manager-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed and notarized macOS DMG
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-${{ env.BUILD_VERSION }}
          path: import-manager/dist/BODAQS-Import-Manager-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Derive build version from release-candidate tag
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        run: echo "BUILD_VERSION=${GITHUB_REF_NAME#Desktop-v}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/cohort-workbench-prototype/package-lock.json
      - name: Install Workbench dependencies
        working-directory: application/cohort-workbench-prototype
        run: npm ci
      - name: Install Tk runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller pillow
      - name: Test Python packages
        env:
          MPLBACKEND: Agg
        run: python -m pytest analysis/tests -q
      - name: Build and smoke-test Linux archive
        run: >-
          bash ./import-manager/build_import_manager_linux.sh --version "$BUILD_VERSION"
          --manager-version "$IMPORT_MANAGER_VERSION" --service-version "$LIBRARY_SERVICE_VERSION"
          --workbench-version "$WORKBENCH_VERSION"
      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign and verify Linux archive with Sigstore
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        run: |
          archive="import-manager/dist/BODAQS-Import-Manager-${BUILD_VERSION}-linux-x64.tar.gz"
          bundle="${archive}.sigstore.json"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-ci.yml@${GITHUB_REF}"

          cosign sign-blob --yes --bundle "$bundle" "$archive"
          cosign verify-blob "$archive" --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Upload unsigned Linux archive
        if: ${{ !startsWith(github.ref, 'refs/tags/Desktop-v') }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-linux-x64-${{ env.BUILD_VERSION }}
          path: import-manager/dist/BODAQS-Import-Manager-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload Sigstore-signed Linux archive
        if: startsWith(github.ref, 'refs/tags/Desktop-v')
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-${{ env.BUILD_VERSION }}
          path: |
            import-manager/dist/BODAQS-Import-Manager-*-linux-x64.tar.gz
            import-manager/dist/BODAQS-Import-Manager-*-linux-x64.tar.gz.sigstore.json
          if-no-files-found: error
          retention-days: 7
